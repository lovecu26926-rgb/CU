name: CU Viral Monitor

on:
  schedule:
    # KST 09:05 / 15:05 / 21:05 / 01:05
    - cron: "5 0,6,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cu-viral-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FORCE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        run: python monitor.py

      - name: Save monitor state and latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update CU viral monitor state [skip ci]"
            git push
          fi
